{% extends 'base.html' %}

{% block title %}Quản lý mẫu{% endblock %}

{% block content %}
<div class="container">
    <h2>Mẫu</h2>
    <a href="{{ url_for('admin.new_template') }}" class="btn btn-primary mb-3">Tạo mẫu mới</a>
    <table class="table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Ngày tạo</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            {% for template in templates %}
            <tr>
                <td>{{ template.id }}</td>
                <td>{{ template.name }}</td>
                <td>{{ template.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                <td>
                    <a href="{{ url_for('admin.edit_template', id=template.id) }}" class="btn btn-sm btn-warning">Sửa</a>
                    <a href="{{ url_for('admin.delete_template', id=template.id) }}" class="btn btn-sm btn-danger">Xóa</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
