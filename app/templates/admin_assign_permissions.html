{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1 class="mt-4">Gán quyền cho {{ user.username }}</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        <div class="form-group">
            {% for permission in permissions %}
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="permissions" value="{{ permission.id }}" id="perm_{{ permission.id }}" {% if permission in user.permissions %}checked{% endif %}>
                <label class="form-check-label" for="perm_{{ permission.id }}">
                    {{ permission.display_name or permission.name }}
                </label>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
        <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Hủy</a>
    </form>
</div>
{% endblock %}
